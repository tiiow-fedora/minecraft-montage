name: tests

on:
  push:
    branches: [main, test-harness]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]   # tomllib needs >= 3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg and a font (for the real-ffmpeg tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest -v
      - name: Goldens are up to date
        # Regenerating must be a no-op: catches goldens that only pass because
        # of a stale file, and nondeterministic output.
        run: |
          UPDATE_GOLDEN=1 python -m pytest -q
          git diff --exit-code -- tests/golden

  windows:
    # The app is a Windows app. ffmpeg is not installed here, so the
    # real-ffmpeg tests skip; everything else (zip rewriting, atomic rename,
    # file renaming semantics) runs on the real platform.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -v
